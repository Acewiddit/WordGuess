<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordGuess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>WORDGUESS</h1>

        <p>Guess the hidden five-letter word!</p>
